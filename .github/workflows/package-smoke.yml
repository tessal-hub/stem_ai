name: Windows package smoke

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller STEMSpellBook.spec --noconfirm
      - name: Verify onedir package
        shell: pwsh
        run: |
          $app = Resolve-Path "dist/STEMSpellBook/STEMSpellBook.exe"
          if ((Get-Item $app).Length -le 0) { throw "Packaged executable is empty" }
      - uses: actions/upload-artifact@v4
        with:
          name: STEMSpellBook-windows
          path: dist/STEMSpellBook
